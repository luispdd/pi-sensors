<span
  class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium tracking-wider uppercase transition-colors"
  [ngClass]="isOnline() ? onlineClasses : offlineClasses"
  data-testid="status-pill"
>
  <span
    class="w-1.5 h-1.5 rounded-full"
    [ngClass]="isOnline() ? 'bg-success-fg shadow-[0_0_6px_var(--success-fg)] animate-pulse' : 'bg-danger-fg'"
    data-testid="status-dot"
  ></span>
  <span data-testid="status-text">{{ displayText() }}</span>
</span>
